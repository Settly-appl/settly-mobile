<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Settly — dziel wydatki i rozliczaj się ze znajomymi.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Settly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Settly</title>
  <link rel="manifest" href="manifest.json">

  <!-- Klawiatura ekranowa: od Chrome 108 Android domyślnie NAKŁADA klawiaturę
       na stronę zamiast zmniejszać viewport, więc Flutter nie widzi jej wcale
       (viewInsets.bottom == 0) i pola tekstowe zostają zasłonięte. Naprawia to
       interactive-widget=resizes-content — ale silnik Fluttera przy starcie
       podmienia meta viewport na własny (bez tej właściwości), więc statyczny
       tag by przepadł. Dopisujemy właściwość PO wstrzyknięciu przez silnik. -->
  <script>
    (function () {
      function patchViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta && meta.content.indexOf('interactive-widget') === -1) {
          meta.content += ', interactive-widget=resizes-content';
        }
      }
      // Silnik wstawia meta do <head> podczas bootstrapu; obserwator łapie to
      // niezależnie od momentu (także po hot-restarcie). Zmiana atrybutu
      // content nie jest mutacją childList, więc nie ma pętli.
      new MutationObserver(patchViewport)
        .observe(document.head, { childList: true });
      window.addEventListener('flutter-first-frame', patchViewport);
    })();
  </script>

  <!-- Wymuszenie świeżej wersji po deployu.
       Reguły Cache-Control z nginx NIE wystarczają: przy strategii offline-first
       Flutter rejestruje service workera, który trzyma powłokę aplikacji (łącznie
       z index.html) w Cache Storage i odpowiada na nawigacje ZANIM żądanie
       dotrze do nginx. Zainstalowane PWA potrafiło więc chodzić na starym
       froncie przeciwko nowemu backendowi aż do przypadkowego podwójnego
       odświeżenia.

       Dwie warstwy, bo żadna sama nie wystarcza:
        1. controllerchange — nowy worker Fluttera woła skipWaiting()/claim(),
           więc przejmuje stronę od razu po instalacji; przeładowanie w tym
           momencie kończy podmianę bez czekania na kolejne wejście.
        2. build-id.json — stempel builda wgrany do obrazu, serwowany bez cache
           i spoza mapy zasobów workera, więc zawsze pochodzi z sieci.
           Porównanie z wartością wkompilowaną w tę stronę wykrywa nieaktualny
           front nawet wtedy, gdy worker zachowa się inaczej, niż zakładamy.

       Kompromis: przeładowanie jest wymuszone (bez pytania), także przy powrocie
       do aplikacji. Formularz wydatku i tak nie zapisuje wersji roboczej, a
       stary front rozmawiający z nowym API kończy się błędem przy zapisie —
       utrata wpisywanej kwoty jest mniej kosztowna niż to. -->
  <script>
    (function () {
      // Podmieniane w obrazie na SHA commita; przy lokalnym `flutter run`
      // zostaje placeholder i cały mechanizm jest wyłączony.
      var BUILD_ID = '__SETTLY_BUILD__';
      var hasBuildId = BUILD_ID.indexOf('__SETTLY') !== 0;
      var reloading = false;
      // Stempel builda odczytany z serwera; potrzebny, żeby po odświeżeniu
      // fontów zapisać, DLA KTÓREGO builda to zrobiliśmy.
      var serverBuildId = null;

      // Bezpiecznik przed pętlą: wyczyszczenie Cache Storage sprawia, że worker
      // instaluje się od nowa i sam potrafi wywołać controllerchange już po
      // przeładowaniu. Zbieżność następuje po jednym, czasem dwóch obiegach;
      // twardy limit na sesję gwarantuje, że błąd nigdy nie zapętli aplikacji.
      function budgetLeft() {
        try {
          var used = parseInt(sessionStorage.getItem('settlyReloads') || '0', 10);
          if (used >= 2) return false;
          sessionStorage.setItem('settlyReloads', String(used + 1));
          return true;
        } catch (e) {
          return true; // brak sessionStorage (tryb prywatny) — nie blokujemy
        }
      }

      // Wymuszenie świeżych fontów przed przeładowaniem.
      //
      // Zasoby Fluttera nie mają hasha w ścieżce: assets/fonts/
      // MaterialIcons-Regular.otf nazywa się tak samo w każdym buildzie, choć
      // jego zawartość zmienia się co build — build przycina font ikon do
      // glifów, których dany build używa. Klienci, którzy zdążyli zapisać go
      // z nagłówkiem „immutable" (patrz nginx/web.conf), trzymają stary font
      // przez rok i zwykłe przeładowanie go nie ruszy, więc każda nowo dodana
      // ikona rysuje się jako nic. cache:'reload' to jedyny sposób, żeby
      // nadpisać już zapisaną odpowiedź w cache HTTP.
      var FONTS_KEY = 'settlyFontsBuild';

      function markFontsFresh(buildId) {
        try {
          localStorage.setItem(FONTS_KEY, buildId);
        } catch (e) {
          // brak localStorage — trudno, przy następnym wejściu spróbujemy raz jeszcze
        }
      }

      function refreshFonts() {
        if (!window.fetch) return Promise.resolve();
        return fetch('assets/FontManifest.json', { cache: 'reload' })
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (families) {
            var urls = [];
            (families || []).forEach(function (family) {
              ((family && family.fonts) || []).forEach(function (font) {
                if (font && font.asset) urls.push('assets/' + font.asset);
              });
            });
            return Promise.all(urls.map(function (url) {
              return fetch(url, { cache: 'reload' }).catch(function () {});
            }));
          })
          .catch(function () {});
      }

      function reloadOnce(reason) {
        if (reloading || !budgetLeft()) return;
        reloading = true;
        console.info('[settly] nowa wersja (' + reason + '), przeładowuję');
        // Czyścimy Cache Storage, bo inaczej worker poda te same stare zasoby
        // także po przeładowaniu.
        var purge = (window.caches && caches.keys)
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          : Promise.resolve();
        purge
          .catch(function () {})
          .then(refreshFonts)
          .catch(function () {})
          .then(function () {
            markFontsFresh(serverBuildId || BUILD_ID);
            window.location.reload();
          });
      }

      // Font ikon dociągamy raz na build, niezależnie od tego, którędy przyszła
      // aktualizacja.
      //
      // Samo przeładowanie przy zmianie build-id nie wystarczyło: nowa wersja
      // potrafi dotrzeć do klienta również przez service workera, przy
      // zamknięciu i ponownym otwarciu aplikacji, bez ani jednego przebiegu
      // reloadOnce. Nowy main.dart.js rysował wtedy ikony starym fontem z cache
      // HTTP i te dodane od poprzedniej wizyty były puste. Klucz w localStorage
      // pilnuje, żeby działo się to raz na build, a nie przy każdym starcie.
      function ensureFontsForBuild() {
        if (!hasBuildId || reloading) return;
        try {
          if (localStorage.getItem(FONTS_KEY) === BUILD_ID) return;
        } catch (e) {
          return; // bez localStorage nie ma jak tego ograniczyć — nie ryzykujemy pętli
        }
        refreshFonts().then(function () {
          markFontsFresh(BUILD_ID);
          // Strona zdążyła się narysować starym fontem; dopiero przeładowanie
          // pokaże świeżo pobrane glify.
          reloadOnce('fonty');
        });
      }

      if ('serviceWorker' in navigator) {
        // Pierwsza instalacja workera też odpala controllerchange — wtedy nie ma
        // czego przeładowywać, bo strona już jest świeża.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (hadController) reloadOnce('service worker');
        });
      }

      function checkBuildId() {
        if (!hasBuildId || reloading) return;
        fetch('build-id.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.buildId) return;
            serverBuildId = data.buildId;
            if (data.buildId !== BUILD_ID) {
              reloadOnce('build-id');
            }
          })
          .catch(function () {
            // Brak sieci albo starszy deploy bez stempla — zostajemy na tym,
            // co działa; warstwa 1 nadal obowiązuje.
          });
      }

      function refresh() {
        checkBuildId();
        ensureFontsForBuild();
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration()
            .then(function (reg) { if (reg) reg.update(); })
            .catch(function () {});
        }
      }

      window.addEventListener('load', refresh);
      // Zainstalowane PWA rzadko bywa przeładowywane — wznowienie z launchera
      // jest w praktyce jedynym momentem, w którym można złapać nowy deploy.
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refresh();
      });
    })();
  </script>

  <!-- PWA install: capture the (Chromium) install prompt so Flutter can trigger
       it on demand. Fires only on Chrome/Edge/Android; iOS never fires it. -->
  <script>
    (function () {
      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
      });
      window.settlyIsInstalled = function () {
        return (window.matchMedia
                 && window.matchMedia('(display-mode: standalone)').matches)
               || window.navigator.standalone === true;
      };
      window.settlyCanInstall = function () {
        return deferredPrompt !== null && !window.settlyIsInstalled();
      };
      window.settlyPromptInstall = async function () {
        if (!deferredPrompt) return 'unavailable';
        deferredPrompt.prompt();
        var choice = await deferredPrompt.userChoice;
        deferredPrompt = null; // a captured prompt can only be used once
        return choice.outcome; // 'accepted' | 'dismissed'
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
