name: CI/CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /opt/settly
  SETTLY_HOST: https://settly.duckdns.org

jobs:
  build-and-push:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch'
    # Native ARM runner (free for public repos): the server is arm64, so we build
    # only arm64 with no QEMU emulation — the old amd64+arm64 QEMU build was slow.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            SETTLY_HOST=${{ env.SETTLY_HOST }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Runs on the self-hosted runner ON the server — no inbound SSH needed.
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}:sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "${{ env.DEPLOY_PATH }}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          echo "Deploying web ${IMAGE}"
          export SETTLY_WEB_IMAGE="${IMAGE}"
          docker compose -f docker-compose.prod.yml pull settly-web
          docker compose -f docker-compose.prod.yml up -d settly-web
          docker image prune -f
          docker logout ghcr.io || true
