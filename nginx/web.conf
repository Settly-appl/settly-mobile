server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Never cache anything that decides WHICH build runs ---------------
    # The entry HTML, the loader, main.dart.js (Flutter emits it under a
    # stable name, versioned only by a ?v= query, so a heuristically cached
    # copy is a stale app), the build stamp, and the service workers.
    # Without an explicit header browsers apply heuristic freshness and can
    # serve a stale bundle for hours.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /build-id.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Always revalidate the service workers so a new deploy is picked up on the
    # next load (browsers otherwise heuristically cache these, delaying updates).
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Assets: revalidate, never "immutable" -----------------------------
    # These do NOT carry a content hash in their path -- the previous comment
    # here claimed they did, and that mistake is what made newly added icons
    # invisible. `assets/fonts/MaterialIcons-Regular.otf` has the same URL in
    # every build while its CONTENT changes with every build: `flutter build
    # web` tree-shakes the icon font down to the glyphs that build uses. Told
    # the file was immutable for a year, a browser kept the older, narrower
    # font and drew every icon added since as nothing -- the old glyphs still
    # worked, which is why this looked like a colour or layout bug twice.
    # The same applies to every other asset (images, AssetManifest) and to
    # canvaskit, whose names are equally stable.
    #
    # "no-cache" still stores the file; it only forces a revalidation, and
    # nginx answers with 304 and no body while the file is unchanged.
    location ~* ^/(assets|canvaskit)/ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback so client-side routes resolve to the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
