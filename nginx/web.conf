server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Never cache anything that decides WHICH build runs ---------------
    # The entry HTML, the loader, main.dart.js (Flutter emits it under a
    # stable name, versioned only by a ?v= query, so a heuristically cached
    # copy is a stale app), the build stamp, and the service workers.
    # Without an explicit header browsers apply heuristic freshness and can
    # serve a stale bundle for hours.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /build-id.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Always revalidate the service workers so a new deploy is picked up on the
    # next load (browsers otherwise heuristically cache these, delaying updates).
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Content-addressed assets: cache hard ------------------------------
    # These carry a content hash in their path, so a new build means a new URL
    # and a stale copy is unreachable rather than wrong. This rule is what the
    # old "long-cache the hashed assets" comment claimed to do but never did.
    location ~* ^/(assets|canvaskit)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback so client-side routes resolve to the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
