server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed Flutter assets; never cache the entry HTML so a new
    # deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback so client-side routes resolve to the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
